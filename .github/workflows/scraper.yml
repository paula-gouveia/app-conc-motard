# .github/workflows/scraper.yml
#
# Executa o scraper automaticamente e importa os dados para o Supabase.
#
# Quando corre?
#   Por defeito: todos os domingos às 06:00 UTC.
#   Também pode ser disparado manualmente via "Run workflow" no GitHub.
#
# SETUP NECESSÁRIO (uma só vez):
#   Repositório → Settings → Secrets and variables → Actions → New secret
#     SUPABASE_URL          → ex: https://xxxxxxxxxxxx.supabase.co
#     SUPABASE_SERVICE_KEY  → chave service_role (Supabase: Settings → API)
#
# Nota sobre o schedule:
#   "0 6 * * 0" = domingos 06:00 UTC = 07:00 Lisboa (inverno) / 08:00 (verão).
#   Para alterar a frequência, mudar o cron abaixo E config.SCRAPER_SCHEDULE.

name: Scraper Concentrações Motard

on:
  schedule:
    - cron: "0 6 * * 0"   # Domingos 06:00 UTC
  workflow_dispatch:        # Permite trigger manual

jobs:
  scrape-and-import:
    name: Scraping + Import para Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Instalar dependências
        run: pip install -r requirements.txt

      - name: Executar scraper
        run: python main.py
        env:
          PYTHONUNBUFFERED: "1"

      - name: Verificar secrets do Supabase
        id: check_secrets
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_SERVICE_KEY" ]; then
            echo "::warning::Secrets do Supabase não configurados — a saltar import."
            echo "Para activar o import automático, vai a:"
            echo "  Settings → Secrets and variables → Actions"
            echo "  e adiciona SUPABASE_URL e SUPABASE_SERVICE_KEY."
            echo "supabase_ok=false" >> $GITHUB_OUTPUT
          else
            echo "supabase_ok=true" >> $GITHUB_OUTPUT
          fi

      - name: Importar para Supabase
        if: steps.check_secrets.outputs.supabase_ok == 'true'
        run: python db/import.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}

      - name: Guardar JSON como artefacto (backup)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: concentracoes-json-${{ github.run_id }}
          path: data/concentracoes.json
          retention-days: 30

      - name: Notificar em caso de falha
        if: failure()
        run: |
          echo "::error::O scraper falhou. Verifica os logs acima."
          echo "Podes fazer um run manual em: Actions → Scraper Concentrações Motard → Run workflow"
